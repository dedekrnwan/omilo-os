# packaging/npm/deploy/docker-compose.runtime.yml — BUNDLED COPY (ships with npx omilo)
# ⚠  KEEP IN SYNC with deploy/docker-compose.runtime.yml at the repo root.
#    To update: cp deploy/docker-compose.runtime.yml packaging/npm/deploy/docker-compose.runtime.yml
#
# deploy/docker-compose.runtime.yml — Omilo LOCAL RUNTIME (self-host stack)
#
# What a self-hosted user runs on their machine.
# OMILO_MODE=runtime: delegates auth/billing to the cloud control plane.
# Users sign in via the cloud, JWT is verified locally (JWKS); workspace data
# stays entirely on this machine.
#
# Copy deploy/.env.runtime.example → .env.runtime, fill in your install token, then:
#
#   docker compose -f deploy/docker-compose.runtime.yml --env-file deploy/.env.runtime up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omilo}
      POSTGRES_USER: ${POSTGRES_USER:-omilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env-runtime}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omilo} -d ${POSTGRES_DB:-omilo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      # Run mode — runtime: delegates auth/billing to the cloud control plane.
      # There is NO /control/* exposure in this mode.
      OMILO_MODE: runtime

      # URL of the cloud control plane. Default points to Omilo's hosted cloud.
      # (pydantic-settings: OMILO_CONTROL_PLANE_URL → Settings.omilo_control_plane_url)
      OMILO_CONTROL_PLANE_URL: ${OMILO_CONTROL_PLANE_URL:-https://api.omilo.app}

      # Install token issued by `omilo-register` on first run.
      # Run: docker compose -f deploy/docker-compose.runtime.yml exec api omilo-register
      # (pydantic-settings: OMILO_INSTALL_TOKEN → Settings.omilo_install_token)
      OMILO_INSTALL_TOKEN: ${OMILO_INSTALL_TOKEN:-}

      # Database — pydantic-settings reads DATABASE_URL → Settings.database_url
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://omilo:omilo@postgres:5432/omilo}

      # App environment label
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile.web
    ports:
      - "7700:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
