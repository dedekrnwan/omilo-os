services:
  postgres:
    image: pgvector/pgvector:pg16  # postgres:16 + the pgvector extension (RAG, P3)
    environment:
      POSTGRES_DB: omilo
      POSTGRES_USER: omilo
      POSTGRES_PASSWORD: omilo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
