# deploy/docker-compose.cloud.yml — Omilo CLOUD CONTROL PLANE
#
# This is the vendor-hosted multi-tenant stack.
# OMILO_MODE=cloud: owns auth + billing + /control/* + Doit webhook.
# Copy deploy/.env.cloud.example → .env.cloud, fill in real values, then:
#
#   docker compose -f deploy/docker-compose.cloud.yml --env-file deploy/.env.cloud up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omilo}
      POSTGRES_USER: ${POSTGRES_USER:-omilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env-cloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omilo} -d ${POSTGRES_DB:-omilo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: ../deploy/Dockerfile.api
    environment:
      # Run mode — this is the authoritative control plane
      OMILO_MODE: cloud

      # Database — pydantic-settings reads DATABASE_URL → Settings.database_url
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://omilo:omilo@postgres:5432/omilo}

      # JWT — RS256 private key PEM. Referenced from env; never baked into the image.
      # (pydantic-settings reads OMILO_JWT_PRIVATE_KEY → Settings.omilo_jwt_private_key)
      # RS256 private key PEM — REQUIRED in production. Set in .env.cloud.
      OMILO_JWT_PRIVATE_KEY: ${OMILO_JWT_PRIVATE_KEY:-}

      # Payment provider — Doit (optional; defaults to manual/offline)
      OMILO_PAYMENT_PROVIDER: ${OMILO_PAYMENT_PROVIDER:-manual}
      DOIT_API_KEY: ${DOIT_API_KEY:-}
      DOIT_SIGNING_SECRET: ${DOIT_SIGNING_SECRET:-}
      DOIT_BASE_URL: ${DOIT_BASE_URL:-https://pay.doit.id/v1}

      # App environment label
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
