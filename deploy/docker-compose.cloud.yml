# deploy/docker-compose.cloud.yml — Omilo CLOUD CONTROL PLANE
#
# This is the vendor-hosted multi-tenant stack.
# OMILO_MODE=cloud: owns auth + billing + /control/*. Plans, prices and the payment
# gateway come from a cloud plugin (OMILO_CLOUD_PLUGIN); without one nothing is sold.
# Copy deploy/.env.cloud.example → .env.cloud, fill in real values, then:
#
#   docker compose -f deploy/docker-compose.cloud.yml --env-file deploy/.env.cloud up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omilo}
      POSTGRES_USER: ${POSTGRES_USER:-omilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env-cloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omilo} -d ${POSTGRES_DB:-omilo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      # Run mode — this is the authoritative control plane
      OMILO_MODE: cloud

      # Database — pydantic-settings reads DATABASE_URL → Settings.database_url
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://omilo:omilo@postgres:5432/omilo}

      # JWT signing — two mutually exclusive paths:
      #   RS256 (RECOMMENDED): set OMILO_JWT_PRIVATE_KEY; runtimes verify via JWKS offline.
      #   HS256 (fallback):    set JWT_SECRET to a strong random value — NEVER the default.
      #
      # JWT_SECRET uses `:?` — compose FAILS FAST if unset or empty, so the weak
      # built-in default ("change-me-in-production") can never slip into production.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a strong random value (or use RS256 via OMILO_JWT_PRIVATE_KEY)}
      # RS256 private key PEM — REQUIRED for the recommended RS256 path.
      # Runtimes then verify JWTs offline via the cloud JWKS endpoint.
      # (pydantic-settings: OMILO_JWT_PRIVATE_KEY → Settings.omilo_jwt_private_key)
      OMILO_JWT_PRIVATE_KEY: ${OMILO_JWT_PRIVATE_KEY:-}

      # Cloud plugin (optional): plans, prices, payment gateway — see omilo/cloud_plugin.py
      OMILO_CLOUD_PLUGIN: ${OMILO_CLOUD_PLUGIN:-}
      OMILO_PAYMENT_PROVIDER: ${OMILO_PAYMENT_PROVIDER:-manual}

      # App environment label
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
