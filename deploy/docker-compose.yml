# Server mode: Postgres (pgvector), Redis, the API (web app included) and a separate worker.
#   cp deploy/.env.example deploy/.env && edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# Behind an existing Traefik (like the Sahabat Warga ops stack): set TRAEFIK_NETWORK and the labels below.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: omilo
      POSTGRES_USER: omilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U omilo"], interval: 10s, retries: 10}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 10}

  omilo-api:
    image: ${OMILO_IMAGE:-ghcr.io/dedekrnwan/omilo:latest}
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    environment: &env
      OMILO_DATABASE_URL: postgresql+psycopg://omilo:${POSTGRES_PASSWORD}@postgres:5432/omilo
      OMILO_REDIS_URL: redis://redis:6379/0
      OMILO_EMBED_PROVIDER: ${OMILO_EMBED_PROVIDER:-local}
      OMILO_SECRET_KEY: ${OMILO_SECRET_KEY:?set OMILO_SECRET_KEY}
      OMILO_PUBLIC_URL: ${OMILO_PUBLIC_URL:?e.g. https://os.example.com}
      OMILO_INTERNAL_URL: http://omilo-api:7700
      OMILO_BASE_PATH: ${OMILO_BASE_PATH:-}
      OMILO_TIMEZONE: ${OMILO_TIMEZONE:-UTC}
      OMILO_COOKIE_SECURE: "true"
      OMILO_EMBEDDED_WORKER: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [omilodata:/data]
    ports: ["127.0.0.1:${OMILO_PORT:-7700}:7700"]
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-false}
      - traefik.http.routers.omilo.rule=${TRAEFIK_RULE:-Host(`os.example.com`)}
      - traefik.http.routers.omilo.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.omilo.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.omilo.loadbalancer.server.port=7700

  omilo-worker:
    image: ${OMILO_IMAGE:-ghcr.io/dedekrnwan/omilo:latest}
    restart: unless-stopped
    command: ["omilo-worker"]
    depends_on: {omilo-api: {condition: service_started}}
    environment: *env
    volumes: [omilodata:/data]

volumes: {pgdata: {}, redisdata: {}, omilodata: {}}
