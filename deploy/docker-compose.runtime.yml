# deploy/docker-compose.runtime.yml — Omilo SELF-HOST RUNTIME stack
#
# What a self-hosted user runs on their machine.
# Default: OMILO_MODE=local — fully local, privacy-first, no cloud env needed.
#   - BYO AI keys (BYOK), no cloud auth or billing required.
#   - Pooled/metered inference disabled (engine refuses cloud jobs).
#   - No OMILO_CONTROL_PLANE_URL or OMILO_INSTALL_TOKEN needed.
#
# After `omilo connect` (hybrid upgrade):
#   OMILO_MODE=hybrid — cloud identity + pooled credits, data stays local.
#   The connect flow writes OMILO_MODE=hybrid + OMILO_CONTROL_PLANE_URL +
#   OMILO_INSTALL_TOKEN into deploy/.env.runtime, then restarts the stack.
#
# Usage (local default — no env file needed):
#   docker compose -f deploy/docker-compose.runtime.yml up -d
#
# Usage (hybrid, after omilo connect):
#   docker compose -f deploy/docker-compose.runtime.yml --env-file deploy/.env.runtime up -d
#
# See deploy/.env.runtime.example for documented variables.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omilo}
      POSTGRES_USER: ${POSTGRES_USER:-omilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env-runtime}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omilo} -d ${POSTGRES_DB:-omilo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      # Run mode — default: local (privacy-first, no cloud required).
      # After `omilo connect`: hybrid (cloud identity + pooled credits, data local).
      # (pydantic-settings: OMILO_MODE → Settings.omilo_mode)
      OMILO_MODE: ${OMILO_MODE:-local}

      # Cloud control plane URL — only used in hybrid mode.
      # Leave unset in local mode (no cloud env needed).
      # (pydantic-settings: OMILO_CONTROL_PLANE_URL → Settings.omilo_control_plane_url)
      OMILO_CONTROL_PLANE_URL: ${OMILO_CONTROL_PLANE_URL:-}

      # Install token issued by `omilo connect` during hybrid upgrade.
      # Leave unset in local mode.
      # (pydantic-settings: OMILO_INSTALL_TOKEN → Settings.omilo_install_token)
      OMILO_INSTALL_TOKEN: ${OMILO_INSTALL_TOKEN:-}

      # Database — pydantic-settings reads DATABASE_URL → Settings.database_url
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://omilo:omilo@postgres:5432/omilo}

      # App environment label
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile.web
    ports:
      - "7700:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
