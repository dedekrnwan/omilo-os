# Postgres (with pgvector) and Redis for running Omilo from the source code. `make db` starts them, `make db-stop`
# stops them; the data stays in Docker volumes. Both listen on 127.0.0.1 only.
name: omilo-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: omilo
      POSTGRES_USER: omilo
      POSTGRES_PASSWORD: omilo
    ports: ["127.0.0.1:${OMILO_PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U omilo -d omilo"], interval: 2s, timeout: 3s, retries: 30}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "100"]
    ports: ["127.0.0.1:${OMILO_REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 3s, retries: 30}

volumes: {pgdata: {}, redisdata: {}}
