# Laptop mode (FULL TIER): Omilo (API + worker + web) with Postgres (pgvector) and Redis, on localhost. Written by `omilo up`.
# For a single-container light tier (SQLite, no sibling services), run the image directly: docker run -p 7700:7700 -v omilo-data:/data ghcr.io/super-saga/saga-os
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment: {POSTGRES_DB: omilo, POSTGRES_USER: omilo, POSTGRES_PASSWORD: omilo}
    volumes:
      - ${OMILO_HOME:-~/.omilo}/postgres:/var/lib/postgresql/data
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U omilo -d omilo"], interval: 3s, retries: 30}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${OMILO_HOME:-~/.omilo}/redis:/data
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 30}

  omilo:
    image: ${OMILO_IMAGE:-ghcr.io/super-saga/saga-os:latest}
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports:
      - "127.0.0.1:${OMILO_PORT:-7700}:7700"
    environment:
      OMILO_DATA_DIR: /data
      OMILO_DATABASE_URL: postgresql+psycopg://omilo:omilo@postgres:5432/omilo
      OMILO_REDIS_URL: redis://redis:6379/0
      OMILO_PUBLIC_URL: http://localhost:${OMILO_PORT:-7700}
      OMILO_INTERNAL_URL: http://localhost:7700
      OMILO_TIMEZONE: ${OMILO_TIMEZONE:-UTC}
      OMILO_EMBEDDED_WORKER: "true"
    volumes:
      - ${OMILO_HOME:-~/.omilo}/data:/data
