[package]
name = "omilo"
version = "0.0.0"
description = "Omilo desktop shell"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "omilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omilo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
