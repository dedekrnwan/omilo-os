name: desktop
# Builds Omilo.app (a .dmg) for Apple Silicon and Intel Macs. Run it by hand (Actions → desktop → Run workflow) or
# push a tag like desktop-v0.4.0 to also publish a release with both .dmg files.
#
# Signing is optional. Without these secrets the app is signed ad hoc: it runs, but macOS asks the first time
# (System Settings → Privacy & Security → Open Anyway). With them it is signed with your Developer ID and notarized:
#   APPLE_CERTIFICATE (the .p12, base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#   ("Developer ID Application: Name (TEAMID)"), APPLE_ID, APPLE_PASSWORD (an app-specific password), APPLE_TEAM_ID
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*", "v*"]
  pull_request:
    paths: ["apps/desktop/**", "scripts/desktop/**", "apps/api/omilo_api/desktop.py", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: apps/desktop/src-tauri}
      - name: Cache downloads and builds
        uses: actions/cache@v4
        with:
          path: dist/cache
          key: runtime-${{ matrix.arch }}-${{ hashFiles('scripts/desktop/build-runtime.sh') }}

      - name: Build the runtime (Python + Omilo, Postgres + pgvector, Valkey, Node, web app)
        run: scripts/desktop/build-runtime.sh

      - name: Signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"; echo "no certificate: ad-hoc signing"; exit 0; fi
          kc="$RUNNER_TEMP/omilo.keychain-db"; pw="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" >/dev/null
          security list-keychain -d user -s "$kc"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign the runtime
        run: scripts/desktop/sign-runtime.sh

      - name: Build Omilo.app and the .dmg
        working-directory: apps/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --bundles app,dmg

      - name: Smoke test (the app's engine starts the office from inside the bundle)
        run: |
          app="$(ls -d apps/desktop/src-tauri/target/release/bundle/macos/*.app | head -1)"
          rt="$app/Contents/Resources/runtime"
          "$rt/python/bin/python3" -m omilo_api.desktop --runtime "$rt" --data "$RUNNER_TEMP/omilo-data" --port 7790 > out.txt 2> err.txt &
          for i in $(seq 1 120); do grep -q "OMILO_READY\|OMILO_ERROR" out.txt && break; sleep 1; done
          cat out.txt; curl -fsS http://127.0.0.1:7790/healthz; kill %1; wait || true
          grep -q OMILO_READY out.txt || { tail -50 err.txt; exit 1; }

      - name: Name the .dmg
        run: |
          v="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          mkdir -p out && cp apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg "out/Omilo-$v-mac-${{ matrix.arch }}.dmg"
          ls -la out
      - uses: actions/upload-artifact@v4
        with: {name: "omilo-mac-${{ matrix.arch }}", path: out/*.dmg}
      - name: Publish (tags only — desktop-v* makes a Mac-only release, v* uploads to the main release)
        if: startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref, 'refs/tags/v')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          case "$GITHUB_REF_NAME" in
            desktop-v*) title="Omilo for Mac ${GITHUB_REF_NAME#desktop-v}" ;;
            *)          title="omilo $GITHUB_REF_NAME" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$title" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" out/*.dmg --clobber
