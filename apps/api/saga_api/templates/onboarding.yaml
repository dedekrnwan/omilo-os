# Choices shown in the guided onboarding. Labels are what the owner sees; keys are stored.
# Saga OS turns the answers into the knowledge files every agent reads (see onboarding.py).

industries:
  shop: Shop or online store
  food: Food and drink
  services: Services (agency, consulting, freelance)
  software: Software or app
  education: Education or training
  health: Health and beauty
  property: Property
  community: Community or non-profit
  other: Something else

stages:
  idea: Just an idea
  started: Just started, first customers
  growing: Growing
  established: Established

team_sizes:
  solo: Just me
  small: 2 to 5 people
  medium: 6 to 20 people
  large: More than 20

goals:
  more_customers: {label: Get more customers, roles: [marketing, sales]}
  more_sales: {label: Close more sales, roles: [sales]}
  content: {label: Post content regularly, roles: [marketing]}
  support: {label: Take better care of customers, roles: [support]}
  numbers: {label: Know my numbers every week, roles: [finance]}
  product: {label: Improve my app or website, roles: [dev], software: true}
  reliability: {label: Keep my app or website running, roles: [ops], software: true}
  save_time: {label: Free up my own time, roles: []}

tones:
  friendly: Friendly
  professional: Professional
  casual: Casual
  formal: Formal
  warm: Warm
  bold: Bold
  playful: Playful
  calm: Calm

languages:
  en: English
  id: Bahasa Indonesia

tools:
  whatsapp: WhatsApp
  instagram: Instagram
  tiktok: TikTok
  facebook: Facebook
  linkedin: LinkedIn
  gmail: Gmail or email
  calendar: Google Calendar
  sheets: Spreadsheets
  drive: Google Drive
  notion: Notion
  slack: Slack
  marketplace: Online marketplace
  website: Our own website
  accounting: Accounting software
  github: GitHub (code)

rules:
  no_promises: {label: "Never promise discounts, refunds or dates I haven't approved", default: true}
  no_data_sharing: {label: Never share customer personal data outside the company, default: true}
  no_contact: {label: Never contact customers or partners without my approval, default: true}
  no_invention: {label: "Never make up numbers, reviews or testimonials", default: true}
  no_spending: {label: Never spend money or sign up for paid services, default: true}
  no_competitors: {label: Never speak badly about competitors, default: false}
  follow_law: {label: "Follow the law where we operate (privacy, advertising, tax)", default: true}

approval_modes:
  ask_all:
    label: Ask me before anything leaves the company
    detail: Helpers draft and research freely. Posting, sending, spending or changing live systems always waits for your OK.
    strict: true
  balanced:
    label: Let them handle routine work, ask me for the important things
    detail: Routine drafts and small code changes go ahead and you get told. Posting, sending messages and spending still wait for your OK.
    strict: false
