[project]
name = "saga-os-api"
version = "0.3.0"
description = "Saga OS gateway: the office between a company owner and their AI staff agents"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "httpx>=0.27",
  "croniter>=2.0",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
  "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
saga-api = "saga_api.main:run"
saga-worker = "saga_api.worker:main"
saga-reset-password = "saga_api.reset_password:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saga_api*"]

[tool.setuptools.package-data]
saga_api = ["templates/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501", "E731"]
