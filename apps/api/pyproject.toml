[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omilo"
version = "0.1.0"
description = "Omilo v2 API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.0",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[project.scripts]
omilo-api = "omilo.main:run"
omilo-migrate = "omilo.cli:migrate"
omilo-seed = "omilo.cli:seed"

[tool.hatch.build.targets.wheel]
packages = ["omilo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
