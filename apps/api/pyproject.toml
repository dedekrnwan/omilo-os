[project]
name = "omilo-api"
version = "0.4.0"
description = "Omilo gateway: the office between a company owner and their AI staff agents"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "httpx>=0.27",
  "croniter>=2.0",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "redis>=5.0",
  "numpy>=1.26",
  "fastembed>=0.4",
  "pypdf>=4.0",
  "pywebpush>=2.0",
  "litellm>=1.81",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=2.0",
  "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21"]

[project.scripts]
omilo-api = "omilo_api.main:run"
omilo-worker = "omilo_api.worker:main"
omilo-migrate = "omilo_api.migrate:main"
omilo-reset-password = "omilo_api.reset_password:main"
omilo-desktop = "omilo_api.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omilo_api*"]

[tool.setuptools.package-data]
omilo_api = ["templates/*.yaml", "templates/workflows/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put apps/api on sys.path so `from tests.test_pieces import ...` resolves under plain
# `pytest` (CI), not only `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501", "E731"]
